name: ロゴ取得

on:
  workflow_dispatch:
    inputs:
      companies:
        description: '企業名・サービス名・アプリ名(改行・「、」・カンマ・/ 区切りで複数可、最大20件)'
        required: false
        type: string
      retry:
        description: 'やり直す名前(複数可。別の検索候補から取り直します)'
        required: false
        type: string
      delete:
        description: 'ストックから削除する名前(複数可)'
        required: false
        type: string

# 取得はAPI保護のため常に直列(ローカル版の単一ワーカーと同じ方針)
concurrency:
  group: fetch-logos
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    # 最大20社 × 最悪ケース(候補の応答待ち等)でも収まる余裕を持たせる。
    # タイムアウトで途中終了しても、下の if: always() コミットが成果を守る。
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip

      - name: 依存関係のインストール
        run: pip install -r requirements.txt

      - name: ロゴ取得とストック更新
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
          REMOVEBG_KEY: ${{ secrets.REMOVEBG_KEY }}
          # inputs はシェルに直接展開せず、必ず環境変数経由で渡す(コマンド注入対策)
          COMPANIES: ${{ inputs.companies }}
          RETRY: ${{ inputs.retry }}
          DELETE: ${{ inputs.delete }}
        run: python tools/ci_fetch.py

      # 取得ステップが失敗・タイムアウトしても、そこまでの成果(API消費分の
      # PNG・キャッシュ)を失わないよう、常にコミットを試みる
      - name: 変更をコミット
        if: always()
        env:
          MSG: 'ストック更新: ${{ inputs.companies || inputs.retry || inputs.delete || ''再生成'' }}'
        run: |
          git config user.name "logo-stock-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs ci-cache
          if git diff --cached --quiet; then
            echo "変更なし(コミットしません)"
            exit 0
          fi
          git commit -m "$MSG"
          # push が拒否されたら(他の実行やレプリケーション遅延でリモートが先行):
          #   1. リモートをマージ(再生成ファイルの衝突は一旦こちらを採用)
          #   2. PNG の合併結果から index/pptx を作り直して積み増す
          # これにより、競合で取得結果(API消費分)が失われることはない
          for i in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push できませんでした(${i}回目)。リモートの先行分を取り込みます"
            git fetch origin
            if ! git merge -X ours --no-edit origin/main; then
              git checkout --ours -- . || true
              git add -A
              git -c core.editor=true merge --continue || true
            fi
            python tools/ci_fetch.py --rebuild-only
            git add docs
            git commit -m "$MSG (競合を解消して再生成)" --allow-empty
          done
          git push
